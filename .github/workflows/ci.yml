name: ci

on:
  push:
  pull_request:

jobs:
  determinism:
    # 等級1再現は「別のマシンで同じハッシュが出る」ことが前提。
    # 前提そのものをOS×Node版のマトリクスで常時証明する（test/golden-repro.test.mjs）。
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test
